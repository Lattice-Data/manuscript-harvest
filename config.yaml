# manuscript-harvest configuration. Every key here has a default in code; this file
# only needs the ones you want to change.

# Acquisition stage: DOI -> PDF + supplementary files.
fetch:
  corpus_dir: "corpus"

  # SET THIS to your own address before running against a publisher. Crossref,
  # NCBI and Europe PMC all ask callers to identify themselves, and it is what
  # keeps a polite client out of the rate-limited pool. Left null, requests go
  # out without one -- which works, but is not the documented convention.
  contact_email: "gabdank@stanford.edu"

  # Optional. Raises NCBI's own ceiling from 3 to 10 requests per second. The two
  # NCBI entries in min_interval_overrides below are set for the keyless ceiling
  # and do not drop on their own when a key is present; with one, 0.15 s on both
  # stays inside the keyed ceiling, and lowering them is what makes a key worth
  # having.
  ncbi_api_key: null

  # Optional. A free TDM key from dev.elsevier.com, sent as an X-ELS-APIKey header.
  # Unlocks the supplementary files -- and the accepted author manuscript PDF -- for
  # Elsevier DOIs, which ScienceDirect and Cell Press otherwise serve our browser a
  # Cloudflare challenge for, so without this those files can only be fetched by
  # hand. Full text is NOT available on a free key (403 needs a separately approved
  # entitlement); article text keeps coming from Europe PMC JATS.
  # MANUSCRIPT_HARVEST_ELSEVIER_API_KEY overrides this when set -- prefer the env
  # var, because this file is tracked in git.
  elsevier_api_key: null

  # Minimum seconds between two requests to the same host, for any host not named
  # in min_interval_overrides below: publishers' PDF and static-content servers,
  # Crossref, anything this tool has not measured. One second is a courtesy none
  # of them asks for. It was 3.0 until 2026-10-09, on a misreading of NCBI's
  # E-utilities guideline -- at most 3 requests *per second* without an API key,
  # 10 with one -- as one request every 3 seconds; a full re-fetch of this corpus
  # spent roughly 1.5 hours asleep on that reading.
  min_interval_seconds: 1.0

  # Per-host exceptions, matched on the exact host name. Anything not listed keeps
  # the default above.
  #
  # NCBI's two hosts: 0.4 s is 2.5 requests a second against the documented
  # keyless ceiling of 3. The guideline is written for the E-utilities (idconv and
  # oa.fcgi on www); pmc.ncbi.nlm.nih.gov is held to the same number because its
  # /bin/ endpoints answer this client with a proof-of-work page, and a burst there
  # would only earn more of them.
  #
  # Europe PMC publishes no limit and enforces per IP; it inherits the default and
  # is listed so that raising the default for unmeasured publishers does not slow
  # the host every article hits four or five times.
  #
  # PMC's Open Access S3 bucket asks for nothing -- it is a bulk object store, and
  # the pmc_s3 tier spends one request per file rather than one per article, so
  # even 1.0 s would leave a 14-supplement paper asleep for ~14 s and one at the
  # max_files cap for ~50 s. 0.2 s is 5 requests a second to a service built for
  # far more. api.elsevier.com is the same shape of case: elsevier_tdm spends one
  # request per attachment against an API the dev portal documents at 10 req/s;
  # 0.2 s is the rate the live probe ran cleanly at, and Object Retrieval publishes
  # no quota, so it stays conservative.
  #
  # bioRxiv goes the other way. www.biorxiv.org is the one host that has
  # rate-limited this client: 11 of the 13 HTTP 429s recorded across the corpus
  # came from it, at the old 3.0 s spacing, on PDFs, JATS and supplement files
  # alike. 5 s is a guess in the safe direction. api.biorxiv.org (the details
  # lookup) never answered 429 and is held to the same number only because it is
  # the same operator and costs at most two requests per preprint.
  min_interval_overrides:
    "www.ncbi.nlm.nih.gov": 0.4
    "pmc.ncbi.nlm.nih.gov": 0.4
    "www.ebi.ac.uk": 1.0
    "pmc-oa-opendata.s3.amazonaws.com": 0.2
    "api.elsevier.com": 0.2
    "www.biorxiv.org": 5.0
    "api.biorxiv.org": 5.0

  timeout_seconds: 60

  # Supplementary files per article, and the ceiling on any one of them. Anything a
  # cap drops is recorded rather than silently skipped, which is how the old values
  # were measured: at 50 files and 200 MB exactly one article in 393 lost anything to
  # the file count -- 10.1126/science.abo1984, whose PMC deposit holds 265
  # supplementary objects, 215 of them dropped -- and exactly two files in the whole
  # corpus were refused for size, at 423.2 MB and 273.5 MB. Both now fit.
  #
  # Raised together because they bound the same thing from two directions and the
  # measured cost is small: those three articles account for roughly 0.8 GB, taking
  # the corpus from 84% to about 87% of max_corpus_gb below. The budget stays the
  # real backstop -- it evicts oldest-first and keeps the manifest -- so a future
  # article with a 300-file deposit cannot quietly fill the disk.
  max_files: 300
  max_file_mb: 500

  # Fetch only supplementary files text can be extracted from. Measured over this
  # corpus: 2428 of the 5116 stored supplementary entries (47%) are images, audio or
  # video, and 138 articles hold at least one -- files that cost a request, a
  # manifest entry and an extraction record apiece, and yield no text. Kept: pdf,
  # txt, md, csv, tsv, xlsx/xls/xlsm, docx/doc/rtf, pptx, xml/nxml, json, html, and
  # archives (.zip/.gz/.tar/.tgz -- mostly supplementary tables, which extraction
  # already unpacks). Skipped: figure images and audio/video. Anything with an
  # unrecognised extension, or none at all, is kept. Every skip is named in the
  # manifest's attempts, so a manifest says what a `false` run would have fetched.
  # Set false to fetch everything, exactly as before this key existed. To remove
  # what a previous run already stored: `manuscript-fetch drop-media`.
  text_bearing_only: true

  # A ceiling on any single plain-HTTP response body, as a backstop. Distinct from
  # max_file_mb, which the tiers enforce against a Content-Length they ask for
  # first: this one bounds a body that arrives without one. It raises rather than
  # truncating, because a short body written to disk would look like a valid file.
  # Unset means unbounded.
  # max_response_mb: 600

  # Disk budget for corpus_dir. Articles average ~40 MB, and the bulk is content
  # the pipeline wants: measured over the whole 26.90 GB corpus, 70% of the bytes
  # are text-bearing files and 19% are archives, against 8% audio/video and 2.8%
  # images. So there is still no useful "drop the media" saving against a budget --
  # staying inside one means giving up whole articles. (text_bearing_only above
  # drops that media anyway, for a different reason: it is half the file *count*.)
  # When exceeded, the oldest are evicted oldest-first; their manifests
  # are kept, so you keep the record of what was there and can re-fetch with
  # --force. null = unlimited. Applied automatically after every fetch whenever
  # this key is set; inspect with `usage`, or force a sweep now with `prune`.
  max_corpus_gb: 30

  # Tried in order. The first five need no credentials and no browser; the last
  # one is the exception path. Drop "proxy_browser" (or pass --oa-only) to
  # guarantee nothing ever opens a browser.
  tiers:
    - europepmc         # PDF + JATS XML + supplementaryFiles ZIP
    # PMC's own bulk S3 bucket: lists the whole deposit, then fetches each object
    # anonymously. Sits here because europepmc still answers a whole article in
    # one request, while this one costs a request per file -- but ahead of
    # pmc_supplements, which is the tier that walks into PMC's proof-of-work page
    # and then 403s. The bucket is never challenged, so trying it first is what
    # stops the common case from asking for a browser it does not need.
    - pmc_s3
    # Elsevier's TDM object API: supplementary files, and the accepted author
    # manuscript, for a Cell Press or ScienceDirect DOI. Needs elsevier_api_key
    # below and does nothing without it. Ahead of pmc_supplements for the same
    # reason as pmc_s3 -- it never meets the proof-of-work page -- and it is the
    # only automated route to these files at all: Cloudflare serves proxy_browser
    # a challenge on those hosts.
    - elsevier_tdm
    - pmc_supplements   # PMC lists the files; the publisher's OA host serves them
    - pmc_oa            # oa.fcgi: mainly an "is this in the OA subset" signal now
    - biorxiv           # 10.1101 and 10.64898 preprints
    - proxy_browser     # institutional proxy + real browser

  # The oa_package FTP tree that oa.fcgi advertises is being retired and its
  # packages currently 404, so the tarball download is off. Turn it on to try.
  try_oa_package: false

  # The last-resort tier reaches articles your library subscribes to, through
  # your institution's proxy. That is your licence, not this tool's: check your
  # institution's terms and your publishers' agreements before enabling it, and
  # do not use it to bulk-download a catalogue. The prefix below is an example
  # (Stanford's EZproxy); replace it with your own institution's.
  proxy:
    enabled: true
    prefix: "https://stanford.idm.oclc.org/login?url="

  # Clearing a JavaScript challenge costs a page load each, so a host that
  # challenges every file would burn one timeout per file. After this many
  # consecutive failures the tier stops trying that fallback and records the
  # remaining files as not attempted, rather than reproving the point per file.
  # max_challenge_failures: 3

  browser:
    profile_dir: "~/.manuscript-harvest/chrome-profile"
    headless: true
    channel: "chrome"                     # real Chrome clears bot checks bundled Chromium does not
    nav_timeout_seconds: 60
    # How long a page may keep navigating before the tier gives up on it. Both
    # exist because an expired session never stops navigating: unbounded, one
    # dead-session fetch took 7.5 minutes to say so.
    settle_deadline_seconds: 20
    content_deadline_seconds: 12
    # How long to sit on PMC's proof-of-work page ("Preparing to download ...")
    # before assuming its script has run. The challenge is per session, not per
    # file, so this is paid once per run and every later file fetches normally.
    # challenge_wait_seconds: 8
    # The article `login` lands on and `check` probes. It MUST be one your library
    # licenses but the public cannot read: pointed at an open-access article, `check`
    # passes with no session at all and tells you nothing. `check` downloads the PDF
    # and validates it, because finding a `citation_pdf_url` is not evidence of
    # access -- publishers emit that on paywalled articles too, for Google Scholar.
    check_url: "https://www.nature.com/articles/s41586-026-10510-x"

# Extraction stage: corpus files -> blocks of text with provenance.
# Only the caps you want to change need to appear here; anything omitted comes
# from manuscript_harvest/extract/limits.py. Every cap this file exposes carries its
# reasoning there; a handful of internal ones are bare numbers, which is the honest
# signal that nothing has yet needed them changed.
extract:
  # Defaults to fetch.corpus_dir, so moving the corpus needs one edit, not two.
  # corpus_dir: "corpus"

  write_markdown: true          # also write extracted/article.md for reading

  limits:
    # max_file_mb is NOT listed here on purpose: it defaults to fetch.max_file_mb
    # above, so raising the fetcher's per-file cap cannot strand files the reader
    # then refuses. Uncomment only to make the reader stricter than the fetcher.
    # max_file_mb: 200
    max_scan_rows: 5000         # rows profiled per sheet (one test corpus sheet is 16,596 x 88)
    max_unique_values: 25       # a column with at most this many values is enumerated
    max_unique_numeric_values: 12
    max_card_chars: 4000        # budget for one table card's text
    max_sample_rows: 3
    max_archive_members: 25
    # Per file inside a zip. Raised from 50: at that value the cap was refusing
    # nine text-bearing members, every one a labelled supplementary table, for
    # 2.64 GB across six articles. This is a memory cap -- archive.py holds each
    # member whole -- so 200 is the peak per member, and the three files still over
    # it (408 MB, 595 MB, 1.09 GB) stay named in the record. See limits.py.
    max_member_mb: 200
    max_archive_depth: 2        # some zips contain only more zips
    min_main_text_chars: 2000   # thinner JATS than this falls back to the PDF
    ocr_dpi: 300                # scanned pages are rendered at this before tesseract
    max_ocr_pages: 25           # 70 scanned files here are 245 pages, longest 11
