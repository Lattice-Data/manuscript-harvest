name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # Then the package itself, so pyproject's own dependency list is
          # exercised rather than taken on trust. It has to agree with the two
          # requirements files -- the same pins are already installed by the line
          # above, so this resolves to nothing new and fails loudly if a
          # requirement was added to one place and not the other. It is also what
          # puts the console scripts on PATH for the smoke test below.
          pip install -e .

      # Playwright is deliberately NOT installed. The browser tier imports it
      # lazily inside a function, and its tests run against fakes, so the suite
      # must pass without a browser. If that ever stops being true, this job is
      # where it should fail.
      # The floor is set just under the current number so it catches a real
      # regression without tripping on noise. Measured: 91.8% here, where
      # tests/test_extract_corpus.py skips itself for want of a local `corpus/`,
      # against 92.9% on a machine that has fetched the papers. CI always reports
      # the first, so a developer reads about a point higher than the badge -- that
      # gap is expected, not a discrepancy, and 90 sits below both.
      - name: Test
        run: >
          python -m pytest tests -q
          --cov=manuscript_harvest
          --cov-report=lcov
          --cov-report=term-missing:skip-covered
          --cov-fail-under=90

      # Uploaded from one interpreter only. Coverage is a property of the suite, not
      # of the Python version, so four uploads per commit would buy no extra signal
      # and would mean coordinating Coveralls' parallel-build protocol to get one
      # number. Authenticates with the built-in GITHUB_TOKEN -- no external secret.
      - name: Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov

      - name: Confirm the browser tier is still optional
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("playwright") is not None:
              sys.exit("playwright is installed; this job no longer proves the "
                       "browser tier is optional")
          import manuscript_harvest.fetch.cli, manuscript_harvest.extract.cli  # must import regardless
          print("ok: both CLIs import with no browser installed")
          PY
          # And as the installed console scripts, which is how the README tells
          # people to run them. An entry point can be wrong in pyproject while the
          # module import above still passes.
          manuscript-fetch --help > /dev/null
          manuscript-extract --help > /dev/null
          echo "ok: both console scripts run with no browser installed"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # From the requirements file rather than a bare `pip install ruff`, so the
      # version this gate runs is the version a developer can install. It was
      # unpinned here and undeclared anywhere, which meant a lint failure could not
      # be reproduced locally except by guessing.
      - run: pip install -r requirements-dev.txt
      # Correctness rules only (F = pyflakes: unused imports, undefined names,
      # f-strings with no placeholders). Deliberately not a formatting gate --
      # this repo's style is hand-maintained and reformatting it would bury the
      # comments that explain why the odd branches exist.
      #
      # The same command is in .githooks/pre-commit, which is the point: this job
      # should be confirming a result rather than discovering it. Keep the two in
      # step if the rule selection ever changes.
      - run: ruff check --select F manuscript_harvest tests

  # The skills under .claude/skills/ are deliberately NOT part of the package:
  # a prompt cannot be tested without a model, so they sit as siblings rather
  # than inside `manuscript_harvest`. That boundary is mechanical and stays --
  # nothing under the package imports them, `pytest.ini`'s `testpaths = tests`
  # does not collect them, and the lint job above is scoped to the package.
  #
  # What does NOT follow from that boundary is leaving them ungated. The README
  # used to name the trade-off outright: "a skill's own tests do not run in this
  # repo's CI, so a skill can rot while the badge stays green." The
  # perturbation-detection skill is 2,900 lines with 115 tests of its own, and
  # it is the artifact this repo is tagged for. So it gets its own job rather
  # than being folded into the one above, which keeps the two boundaries
  # separate: the package's coverage gate stays a statement about the package,
  # and a skill failure is legible as a skill failure.
  #
  # Discovered rather than listed. A second skill directory with tests/ is
  # picked up with no edit here, which is the point of the one-folder-per-
  # question layout.
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # pyyaml is the skills' only runtime dependency and it is already a
      # package requirement; ruff and pytest come from the dev file so this job
      # runs the same versions a developer can install.
      - run: pip install -r requirements-dev.txt pyyaml

      # Every skill's suite must be collected AND non-empty. A `pytest` that
      # finds no tests exits 5, which reads as a failure -- but a skill whose
      # tests silently stopped being discovered would otherwise pass this job by
      # running nothing, which is the same vacuous-pass shape pe/runstate.py
      # exists to prevent one layer down.
      - name: Test each skill
        run: |
          set -euo pipefail
          found=0
          for skill in .claude/skills/*/; do
            [ -d "$skill/tests" ] || continue
            found=$((found + 1))
            echo "::group::pytest $skill"
            ( cd "$skill" && python -m pytest tests -q )
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no skill with a tests/ directory was found -- this job ran nothing" >&2
            exit 1
          fi
          echo "ok: $found skill suite(s) passed"

      # Same rule selection as the package, for the same reason: correctness
      # only, no formatting gate.
      - name: Lint each skill
        run: |
          set -euo pipefail
          for skill in .claude/skills/*/; do
            [ -d "$skill/pe" ] || continue
            ruff check --select F "$skill/pe" "$skill/tests"
          done

      # The skills take a corpus path as an argument and vendor what they need,
      # so each one must run against any directory of extracted papers rather
      # than only this repo's. A run root that does not exist is the cheapest
      # proof that no test depends on one: the corpus-scale negative control
      # skips instead of failing.
      - name: Confirm no test needs a local run directory
        run: |
          set -euo pipefail
          for skill in .claude/skills/*/; do
            [ -d "$skill/tests" ] || continue
            ( cd "$skill" && PERTURBATION_RUN_ROOT=/nonexistent \
                python -m pytest tests -q )
          done
