name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Playwright is deliberately NOT installed. The browser tier imports it
      # lazily inside a function, and its tests run against fakes, so the suite
      # must pass without a browser. If that ever stops being true, this job is
      # where it should fail.
      # The floor is set just under the current number so it catches a real
      # regression without tripping on noise. Note that CI always measures the
      # no-corpus figure: tests/test_extract_corpus.py skips itself without a local
      # `corpus/`, so a developer running with one present will read higher than the
      # badge. That gap is expected, not a discrepancy.
      - name: Test
        run: >
          python -m pytest tests -q
          --cov=manuscript_harvest
          --cov-report=lcov
          --cov-report=term-missing:skip-covered
          --cov-fail-under=70

      # Uploaded from one interpreter only. Coverage is a property of the suite, not
      # of the Python version, so four uploads per commit would buy no extra signal
      # and would mean coordinating Coveralls' parallel-build protocol to get one
      # number. Authenticates with the built-in GITHUB_TOKEN -- no external secret.
      - name: Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov

      - name: Confirm the browser tier is still optional
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("playwright") is not None:
              sys.exit("playwright is installed; this job no longer proves the "
                       "browser tier is optional")
          import manuscript_harvest.fetch.cli, manuscript_harvest.extract.cli  # must import regardless
          print("ok: both CLIs import with no browser installed")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Correctness rules only (F = pyflakes: unused imports, undefined names,
      # f-strings with no placeholders). Deliberately not a formatting gate --
      # this repo's style is hand-maintained and reformatting it would bury the
      # comments that explain why the odd branches exist.
      - run: ruff check --select F manuscript_harvest tests
