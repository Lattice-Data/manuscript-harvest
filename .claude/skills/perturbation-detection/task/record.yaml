# TABLE 1 of 4 — WHAT COUNTS.
#
# Every closed value set and every field-shape rule the record must satisfy.
# These lived as module constants in pe/validate.py and pe/pending.py, where a
# reader could not tell the harness's own vocabulary (`processing_status`, which
# any per-paper task needs) from this task's (`category`, which no other task
# would have). Here the distinction is the file they are in.
#
# Nothing here decides anything. Deciding is decide.yaml plus rules.py; this is
# only what a well-formed record looks like. Exactly one of these sets had a
# drift guard against prompt.md before now -- `suppression.rules` -- and that one
# existed because v0.0.7 stated a rule in three places and changed it in two.

# The classification's own values, and the enum three fields are checked against.
# NOT the confusion matrix's reading order: `change.py` reads that from
# `change.yaml: order`, which is deliberately a different sequence (yes/unclear/no
# -- unclear sits between the two calls it lies between). Reordering this list
# will not move that matrix, and the comment that said it would sent a
# maintainer to the wrong file.
# QUOTED, and the loader rejects an unquoted form. YAML 1.1 parses bare `yes`
# and `no` as booleans, so `[yes, no, unclear]` loads as `[True, False,
# 'unclear']` and every tri-state comparison in the harness silently stops
# matching -- a determination would compare against True and never equal the
# string the model emitted. Caught here before it shipped; `task.tables()` now
# refuses a pack whose label sets contain a boolean, because this is exactly the
# "looks like it works and does not" failure the rest of this pass was about.
labels: ["yes", "no", "unclear"]

# `perturbation_present` ONLY. Deliberately not added to `labels` above: that set
# is also the enum for `has_single_cell_assay` and
# `perturbation_present_any_assay`, and `has_single_cell_assay:
# "not_applicable"` is not a thing. Widening the shared set would have made it
# legal on all three -- the kind of silent over-permission the quoting comment
# above is also about.
#
# `not_applicable` means the paper reports no study of its own (a review,
# commentary, perspective, editorial). It is NOT a negative: such a paper often
# describes perturbation experiments at length, so "no" would assert the
# opposite of what the text shows, and "unclear" would claim a gap in the text
# when the text is complete and simply belongs to a different article type.
# QUOTED for the same YAML 1.1 reason as the rest.
determination_labels: ["yes", "no", "unclear", "not_applicable"]

# The article-type gate's two values. Quoted: bare `yes`/`no` load as booleans.
primary_research: ["yes", "no"]

# The field a curator reads. `pe.compare` diffs this and nothing else, and
# `primary_field_gloss` is how the diff describes it to a reader -- "assay-paired"
# is the whole point of this task and would be lost if the harness just printed
# the field name.
primary_field: perturbation_present
primary_field_gloss: "the assay-paired `perturbation_present`"

# What the model returned before the harness pruned unverified evidence. Kept so
# the gap between the two measures fabricated evidence directly.
model_field: perturbation_present_model

# Harness vocabulary, not task vocabulary: how the INPUT was, not what it says.
# Any per-paper extraction task over imperfect text needs both, so a second pack
# would inherit these unchanged rather than restating them.
run_states:
  processing_status: [ok, partial, failed]
  text_completeness: [full, truncated, methods_missing, unknown]

# Why an `unclear` is unclear. Three of the six name this task; the triage ladder
# gives a tier to two of them (report.yaml).
unresolved_reasons:
  - degraded_text
  - pairing_not_stated
  - assay_type_unconfirmed
  - perturbation_role_unclear
  - contradiction_unresolved
  - none

# A record missing any of these is a partial write and is re-run rather than
# validated (pe.pending). `suppressed_candidates` is on the list deliberately:
# v0.0.9 told the model to note its exclusions in free text and nothing checked
# that it had, so the exclusions went unrecorded. Requiring the field is what
# makes it enforceable.
required_fields:
  - task_version
  - sources_seen
  - processing_status
  - text_completeness
  - text_defects
  - has_single_cell_assay
  - perturbation_present
  - perturbation_present_any_assay
  - unresolved_reason
  # Required rather than optional-defaulting-to-"yes": a gate that is silently
  # absent is a gate that never fires, which is the shape six of the seven
  # detection-review blockers had.
  - reports_primary_research
  - consistency_flags
  - perturbations
  - suppressed_candidates

# A field that satisfies a required one under its old name. 0.0.13 renamed
# `schema_version` to `task_version`; without this, all 392 records already
# scored would read as `incomplete` and queue a full corpus re-extraction on the
# strength of a rename.
legacy_field_names:
  task_version: schema_version

# Flat checks, in the order they were written, so the `issues` list a record
# carries is unchanged. `message` is the wording; `in` names the set.
field_checks:
  - path: perturbation_present
    in: determination_labels
    message: "{path}={value!r} not in yes/no/unclear/not_applicable"
  - path: has_single_cell_assay
    in: labels
    message: "{path}={value!r} not in yes/no/unclear"
  - path: perturbation_present_any_assay
    in: labels
    message: "{path}={value!r} not in yes/no/unclear"
  - path: processing_status
    in: run_states.processing_status
    message: "{path}={value!r} off-schema"
  - path: text_completeness
    in: run_states.text_completeness
    message: "{path}={value!r} off-schema"
  - path: unresolved_reason
    in: unresolved_reasons
    message: "{path}={value!r} off-schema"
  - path: reports_primary_research
    in: primary_research
    message: "{path}={value!r} off-schema"

# The determinative array. Each item carries evidence quotes that are verified
# against the source they claim; an item left with no verifiable quote is dropped
# whole and the paper-level call is recomputed over what survives.
item_array:
  path: perturbations
  label_field: single_cell_paired      # the per-item tri-state Stage A reads
  name_field: agent                    # what the item is called, for messages
  quotes_field: evidence_quotes
  # A second quote whose failure downgrades one sub-field rather than dropping
  # the item: the pairing becomes "unclear" and EV-PAIRING-DOWNGRADED is flagged.
  secondary_quote_field: assay_evidence
  secondary_downgrades: single_cell_paired
  drop_when_no_verified_quote: true
  enums:
    category: [chemical, biologic, activation_stimulation, genetic,
               physical_environmental, dietary, other]
    single_cell_paired: labels
  # OPEN values. A closed set would have to enumerate every model organism in
  # advance and killifish is the case that breaks such a list, so the harness
  # checks the TYPE and never the value. `null` is legitimate: an unstated
  # organism is unstated, and the prompt forbids guessing it.
  open_fields:
    paired_organism: string_or_null

# Arrays that point INTO the item array by index. Pruning renumbers them, so a
# reference can never dangle at a dropped item.
ref_arrays:
  - path: samples
    ref_field: perturbation_refs
    points_at: perturbations
    enums:
      is_single_cell_assay: labels
    open_fields:
      organism: string_or_null
    # true | false | "unclear" are all legal here, by curator ruling of
    # 2026-08-20. Only `is True` counts as perturbed downstream; the unclear
    # count is reported rather than folded into either bucket.
    tristate_bool_fields: [perturbed]

# The text-quality array, v0.0.25. DETERMINATIVE -- Stage B's cap reads it -- but
# unlike `item_array` it carries no per-item label any rule reads: it is evidence
# FOR a gate, verified the same way every other quote is.
#
# Why it exists. Stage B's entry condition was `processing_status == "partial" OR
# text_completeness != "full"`, two paper-level adjectives with no evidence
# behind them, and it flipped on byte-identical input: 3 of 30 papers in the
# v0.0.23 acceptance, 4 of 24 in v0.0.24's. Reading those eight flips, three
# quarters of them were adjudicable by a QUOTE the model had already seen --
# a verbatim mid-article break, dangling cross-references to absent methods,
# located runs of mojibake -- and the rest named no locus at all.
#
# Why per-source. `science.aat1699` flipped because one run described the garbled
# supplement and the other the intact main text. Both statements were true, and
# the schema had nowhere to hold both at once.
defect_array:
  path: text_defects
  source_field: source_id
  kind_field: kind
  quote_field: quote
  kinds: [ends_mid_sentence, explicit_cut_marker, garbled_run, no_methods_content]
  # The one kind that is an ABSENCE, so it cannot be quoted: `quote: null` is
  # legal for it alone. The harness FALSIFIES it instead of confirming it --
  # rejecting the claim when a methods-labelled section was in fact supplied --
  # because "there is no methods text" has no substring to check.
  unquotable_kinds: [no_methods_content]
  # Section labels that count as methods content, for that falsification. A list
  # rather than one name because publishers differ and `pe.prepare` records
  # whatever the extractor labelled.
  methods_section_names: [methods, experimental, star methods, online methods,
                          materials and methods, methodology]
  # And how much of it has to be there. Measured over the 392-paper corpus: the
  # median paper supplies 28,467 characters under those labels and the 10th
  # percentile 8,422, while the heading-only cases -- a label with nothing under
  # it -- top out at 478. `10.1126/science.aat1699` has 228 (two copies of
  # "Materials and Methods" plus a list of figure captions) and its
  # `methods_missing` report is CORRECT, so a check keyed on the label existing
  # would have refuted a true claim and silently released the cap on the one
  # text in this corpus that is genuinely broken.
  #
  # 2,000 sits above every heading-only case and far below the bulk of real
  # methods sections. Ten papers fall in the 0-1,949 band where this declines to
  # refute anything, which is the intended behaviour: **15 corpus papers supply
  # ZERO methods-labelled characters and most of them are correctly "full"**,
  # because JATS and Science put methods under labels the extractor never
  # matched. The label measures LABELLING, not content -- so this check may only
  # ever refute a claim, never confirm one.
  methods_min_chars: 2000

# Fields on the record the HARNESS writes, not the model. Kept distinct because
# prompt.md is explicit that `text_completeness` is the model's call on the text
# it was given, and that having two owners would make it unreadable -- so the
# harness's own findings go in fields of their own rather than overwriting the
# model's, and every one of them is a fact the model could not see.
# A mapping rather than a list, because both of these are needed BY ROLE and
# picking them out of a list by index is the positional coupling that breaks
# silently when somebody inserts a line.
#
# Only the two the gate READS are here. `needs_section_pass` and
# `text_completeness_source` are also harness-written, and are deliberately NOT
# declared: `pe/` writes both as literals it owns end to end, so a declaration
# would be a name nothing reads -- which is the defect `cap.reason` was, and
# `test_no_key_in_a_pack_table_is_read_by_nothing` caught this within the hour.
harness_written_fields:
  withheld: harness_withheld            # the truncation ladder ran, or ran out
  defect_unreadable: defect_claim_unreadable   # a defect was claimed and botched

# Non-determinative arrays: things considered and rejected. Structurally unable
# to move the determination, because Stage A reads only the fields above.
secondary_arrays:
  - path: suppressed_candidates
    name_field: candidate
    reason_field: rule
    quote_field: evidence_quote
    pairing_field: would_have_paired
    # An unverifiable quote drops the QUOTE and keeps the ENTRY. Deleting the
    # entry would restore exactly the silence the field was added to remove, and
    # would make a bad quote look like a decision nobody made.
    keep_entry_on_quote_failure: true
    unverified_flag: EV-SUPPRESSED-UNVERIFIED
    # A null quote is legitimate when the exclusion rests on the ABSENCE of a
    # statement: the Methods never placing a construct in the sequenced material
    # is not quotable.
    quote_optional: true
    # CLOSED on purpose. The field exists to be tallied -- "how many papers did
    # the reporter rule hold back from yes?" -- and an open string cannot be.
    #
    # No count of this list is written anywhere. It was stated as "eight" in four
    # places, and the first time the set grew -- v0.0.15, by curator ruling --
    # three of them would have gone stale. prompt.md's exclusion table owns the
    # scopes and this list owns the values; neither states how many there are.
    #
    # Arrival order, for reading the history rather than for any code:
    # reporter_or_marker .. derivation_formulation came with v0.0.9,
    # disease_model_establishment with v0.0.15, and the rest are older rules that
    # had always been silent.
    reasons:
      - reporter_or_marker
      - incidental_clinical_therapy
      - unintended_condition
      - derivation_formulation
      - disease_model_establishment
      - observational_disease_state
      - sample_handling_protocol
      - readout_reagent
      - routine_processing
    # The subset whose boundary is under active review -- the v0.0.9 additions
    # plus v0.0.15's. Triage uses this subset so its tier means "a rule we are
    # still arguing about held this paper back" rather than "this paper has a
    # disease contrast": `observational_disease_state` fires on any
    # tumour-vs-normal contrast, which is most clinical papers, and an
    # unrestricted tier put 5 of 6 regression papers in it. A tier that holds
    # most papers is not a queue.
    #
    # `disease_model_establishment` is here because it is the newest boundary and
    # its entries will almost always carry `would_have_paired: "yes"` -- an
    # engraftment or an induced mutation pairs trivially to the assay run on the
    # tissue it produced. Those are exactly the papers a curator should ratify
    # rather than discover later, and there are few enough of them not to drown
    # the tier.
    reasons_under_review:
      - reporter_or_marker
      - incidental_clinical_therapy
      - unintended_condition
      - derivation_formulation
      - disease_model_establishment

# Values counted as the same thing when tallying an open field. Used for
# reporting only -- an organism never reaches the determination.
#
# There is deliberately no `field:` key here any more. It said `organism`, which
# is the sample-level field, while the human tally reads the perturbation-level
# `paired_organism` -- so the key named one of the two fields the normaliser is
# applied to and could not drive either. `is_human(value)` takes a VALUE, not a
# field: the caller decides what to normalise, which is why nothing read this and
# why wiring it up would have been inventing a contract rather than honouring one.
normalisers:
  human:
    synonyms: [human, humans, homo sapiens, "h. sapiens", hsapiens, patient,
               "human (patient)", "9606"]

