# TABLE 2 of 4 — HOW TO DECIDE.
#
# The inputs the determination is a function of, the damaged text downgrade, and the
# consistency codes with their wording. The ORDERED RULES themselves are
# `rules.decide()` in rules.py rather than data here, and that is a deliberate
# choice rather than an unfinished one -- see the note at the bottom.

# The complete input set. Stage A and Stage B read nothing else, so two runs that
# agree on all five and still disagree on the determination indicate a logic bug
# rather than a difference of reading. `harness.compare` uses exactly this list, which
# is the point of stating it once: the diff and the decision must agree about
# what the decision reads.
inputs:
  processing_status: processing_status
  text_completeness: text_completeness
  has_single_cell_assay: has_single_cell_assay
  any_assay: perturbation_present_any_assay
  paired: perturbations[].single_cell_paired
  # v0.0.25. Stage B's trigger moved here from the two paper-level fields above,
  # which STAY on the record and stay the model's own summary -- they simply no
  # longer decide anything. `harness_withheld` is written by the harness, not the
  # model, and is the one input on this list the model cannot see.
  defects: text_defects[].kind
  harness_withheld: harness_withheld
  # Fails CLOSED, and this is the input that does it. A quote that does not
  # verify is a claim REFUTED -- dropped, no downgrade, the negative stands. An entry
  # that cannot be read at all is a claim UNKNOWN: the model saw something and
  # botched the report of it, which is not evidence that the text is whole. The
  # old trigger got this exact distinction wrong in the other direction -- it
  # tested enum membership first, so None, "", "Full" and "truncated " all
  # escaped the downgrade while an honest "unknown" was downgraded.
  defect_unreadable: defect_claim_unreadable

# Stage B. Asymmetric on purpose: missing text can hide the sentence that would
# have paired a perturbation to a qualifying assay, but it cannot invent one, so
# only a negative is downgraded. A positive stands on the evidence it has.
#
# `when_completeness_not: full` means ANYTHING other than "full" -- including a
# malformed or absent value. The guard here used to test membership of the legal
# enum first, so None, "", "Full" and "truncated " all escaped the downgrade and kept
# the "no", while an honest "unknown" was downgraded. A safety mechanism a typo
# switches off is not one.
damaged_text_downgrade:
  from: "no"
  to: unclear
  # v0.0.25: the trigger is auditable, and it is not an adjective.
  #
  # It WAS `processing_status == "partial" OR text_completeness != "full"` -- two
  # paper-level self-reports with no evidence requirement, which is why it flipped
  # on byte-identical input in two consecutive acceptance passes (3 of 30, then 4
  # of 24). v0.0.24 removed one cause by telling the model which cuts were the
  # pipeline's own; the residual was a judgment with nothing behind it.
  #
  # Now the downgrade fires on either of two facts. `harness_withheld` is the ladder
  # having run at all, which the model cannot see and cannot dispute. A defect is
  # the model's observation, kept only where the harness could verify the quote it
  # cites -- see record.yaml's `defect_array`.
  when_harness_withheld: true
  # WHICH defects downgrade. Curator decision, 2026-09-16: the downgrade exists because
  # missing text can hide the sentence that would pair a perturbation to a
  # qualifying assay. A garbled TABLE in a supplementary reporting summary cannot
  # hide that sentence; an absent methods section can, wherever it lives. So a
  # defect in the main text downgrades, and missing methods downgrades from any source.
  #
  # The alternative -- any defect in any source -- is what the old rule did in
  # effect, and it holds `10.1126/science.aat1699` at "unclear" over three garbled
  # supplementary tables while curator ruling 6 on that paper is "no".
  when_defect_in_sources: [main]
  when_defect_kind_any_source: [no_methods_content]
  # No `reason:` here. It said `degraded_text`, which is what
  # `reason_rules.downgrade_reason` below says and what the harness actually reads --
  # one value stated twice in one file, and only one of them wired. That is the
  # v0.0.7 shape in miniature, so the unread copy is gone rather than kept for
  # symmetry.

# CC-1 .. CC-6 and CC-8 are computed from the record; CC-7 is raised by the
# harness during quote checking, when a quote cites a source_id that was never
# supplied. The messages are the wording a curator reads.
#
# No count of this set is written anywhere, and CC-8 is appended rather than
# slotted in. Renumbering is the documented trap that has already cost one
# version boundary, and a stated count is the v0.0.12 failure shape.
checks:
  CC-1: "has_single_cell_assay='no' but a perturbation is single_cell_paired='yes'"
  CC-2: "perturbation_present_any_assay='yes' with an empty perturbations array"
  CC-3: "perturbation_present_any_assay='no' but perturbation(s) reported"
  CC-4: "a single_cell_paired value outside yes/no/unclear"
  CC-5: "has_single_cell_assay='unclear' with a single_cell_paired='yes'"
  CC-6: "processing_status='failed' with a non-empty perturbations array"
  CC-7: "a quote citing a source_id that was never supplied"
  CC-8: "reports_primary_research='no' with a non-empty perturbations array"

# Raised by the harness rather than computed from the record.
harness_raised_checks: [CC-7]

# Post-conditions on `unresolved_reason`. A determination that is not `unclear`
# has no reason to be unresolved, and an `unclear` with no reason is not
# triageable -- report.yaml's ladder gives the latter a tier so it cannot sink.
reason_rules:
  none_value: none
  required_when: unclear
  downgrade_reason: degraded_text

# ---------------------------------------------------------------------------
# Why the ordered rules are NOT data here.
#
# prompt.md publishes Stage A as a 10-row truth table with explicit wildcards,
# so expressing it as YAML rows plus a small matcher is genuinely possible, and
# it was the first thing tried. It was rejected for one reason: a table needs a
# predicate vocabulary, that vocabulary is a guess until a SECOND task has a
# decide step to compare against, and the recorded decision of 2026-08-31 is
# explicit that `stage_a` "is the piece expected to be shaped differently per
# question, so the seam is a guess until two real cases exist".
#
# Inventing an expression language for one instance would make the pack harder
# to write and the harness harder to trust, in exchange for a generality nobody
# can yet check. So the rules are three functions in rules.py -- `decide`,
# `checks`, `metrics` -- and the harness calls them without knowing what they
# mean. A second pack writes three functions, not a table; if a third pack's
# functions turn out to have the same shape, THAT is the moment to lift them
# into rows here, with two real cases to draw the vocabulary from.
#
# What is data above is data because it is a list or a message, not a rule.
# ---------------------------------------------------------------------------
