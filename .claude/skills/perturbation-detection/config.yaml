# Perturbation extraction configuration.
# This file is READ by harness.prepare and harness.validate — it is not documentation.

# Where the extracted papers live: one directory per paper, each containing
# extracted/blocks.jsonl.
#
# There is deliberately no `corpus_dir:` key here any more, and this is the
# reason. It used to read `./corpus`, which resolves against the CWD -- and
# every documented invocation runs from this directory, where a stale
# 382-paper copy sits beside this file. The real corpus is the 392-paper tree
# at the repo root, which is what `papers-all.txt` names and what SKILL.md and
# README both pass explicitly as `--corpus ../../../corpus`. So the default
# could only ever fire when someone FORGOT the flag, and when it fired it
# silently selected a different, smaller corpus: 10 of the 392 papers simply
# absent, both trees gitignored, nothing to diff.
#
# `--corpus` is now required, by harness.prepare and harness.validate alike. Setting
# `corpus_dir` here still works if a checkout wants a default, but it has to be
# written on purpose. Same treatment as `output_dir` below: a default nobody
# meant to use is worse than no default.
#
# The 382-paper copy is not deleted by this change -- that is the curator's
# call, not the harness's.

# Text reconstruction. Sections are matched as substrings of the block's
# `section` field. 'back_matter' is what JATS-derived articles actually use for
# acknowledgments / author contributions / declaration of interests, so the
# flat names below are not sufficient on their own.
exclude_sections:
  - references
  - supplementary
  - acknowledgments
  - competing_interests
  - funding
  - back_matter
  - data_availability

# Supplementary content is caught primarily by source_file (see
# harness/paper_text.py); `section` is often null for PDF-derived articles, so
# section-only filtering leaks whole supplementary PDFs into the paper text.

# Block kinds fed to the model. 'table' is excluded on purpose: the Cell Press
# KEY RESOURCES TABLE lists every reagent in the lab, and this task turns on
# the ROLE a reagent plays, not its presence.
include_kinds:
  - metadata
  - heading
  - paragraph
  - caption

# Quote validation. `threshold` is the only key here, and it is read by
# harness.validate. `enabled`, `normalize_unicode` and `normalize_punctuation` used to
# sit beside it and were read by NOTHING: normalisation is unconditional in
# harness.paper_text.normalize_text, because prompt.md requires the same
# normalisation on both sides of a comparison and a switch that turned it off on
# one side only would make every quote check meaningless. Removed for the reason
# stated at the bottom of this file about `output_dir` -- a key nobody reads
# looks like it works and does not.
fuzzy_match:
  threshold: 0.85  # similarity below which a quote counts as unlocatable

# Two more keys have been removed rather than left to look functional.
# `confidence_thresholds` (high/medium/low bands) had no reader: the one
# threshold triage actually applies is paper_confidence < 0.6 in
# harness.summarize.triage_priority, which came from prompt.md step 10 and matched
# none of the three band edges here, so the file described a rubric the code did
# not use. `flag_all_for_review: true` had no reader either -- harness.validate sets
# `needs_review = True` on every record unconditionally, which is the curator's
# standing decision and not a setting; a key implying it could be switched off
# was the misleading part.

# Run artifacts (work/ and output/) live OUTSIDE this directory: `claude -p`
# cannot write under `.claude/` and exits 0 regardless, so results written
# here are lost silently. The location comes from harness/runroot.py, overridable
# with PERTURBATION_RUN_ROOT or per-invocation with --work / --out. There is
# deliberately no `output_dir:` key here any more -- the old one was read by
# nothing, so setting it looked like it worked and did not.
include_supplementary: true
budget_chars: 400000
