[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscript-harvest"
# Read from `manuscript_harvest.__version__` rather than repeated here. That
# attribute had no reader at all while this line was its hand-kept twin, so the two
# could disagree with nothing to notice. The per-stage `__version__` values in
# `fetch/` and `extract/` are deliberately separate: they are stamped into every
# manifest and extraction record as `fetcher_version` and `extractor_version`, and
# move independently of the distribution.
dynamic = ["version"]
description = "Fetch published papers from a DOI and extract their text and supplementary tables with provenance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lattice Data Coordination" }]
keywords = ["bibliometrics", "text-mining", "open-access", "jats", "curation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Text Processing",
]
dependencies = [
    "pymupdf>=1.28",
    "requests>=2.31",
    "pyyaml>=6.0.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# The library-proxy tier. Kept out of the base install so the open-access path
# stays dependency-light and CI needs no browser.
browser = ["playwright>=1.45"]
# Legacy binary .xls supplements; rare enough not to be a default.
xls = ["xlrd>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
manuscript-fetch = "manuscript_harvest.fetch.cli:main"
manuscript-extract = "manuscript_harvest.extract.cli:main"
manuscript-select = "manuscript_harvest.select.cli:main"

[tool.setuptools.dynamic]
version = { attr = "manuscript_harvest.__version__" }

[tool.setuptools.packages.find]
include = ["manuscript_harvest*"]

# Statement coverage, stated rather than left to whichever flags a run happens to
# carry. The figure CI gates on and the badge both mean statements, so a run that
# silently switched to branch mode would report a lower number for the same suite.
# Being explicit also heads off `coverage.exceptions.DataError: Can't combine
# statement coverage data with branch data`, which is what a `--cov-append` run
# onto data from a `--cov-branch` run raises -- after the tests have already
# passed, so it reads as a test failure rather than a mode mismatch.
[tool.coverage.run]
branch = false
