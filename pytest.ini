[pytest]
testpaths = tests
# --strict-markers is what makes the registration below mean anything: without it a
# misspelled `@pytest.mark.netwrok` passes with a warning nobody reads, which is the
# opposite of what a marker is for. Verified -- that typo passes without this flag
# and is a collection error with it.
addopts = --strict-markers
# Deliberately NOT deselected by default: the marked tests already refuse to run
# without MANUSCRIPT_HARVEST_MANUAL_NETWORK=1, so the default run stays offline
# without the marker having to enforce it.
markers =
    network: hits live publisher services; needs the manually fetched papers and an explicit opt-in
# Keep PyMuPDF's SWIG deprecation noise out of the output; it is not ours to fix.
# The two openpyxl entries are for the *fixtures* that build deliberately odd
# workbooks (the strict-OOXML one, and a zip written with a duplicate member name).
# openpyxl's "extension is not supported" warnings need no entry here:
# manuscript_harvest/extract/spreadsheet.py silences those at the call site, around
# the row iteration as well as the load, so they never reach pytest.
filterwarnings =
    ignore:builtin type Swig.*:DeprecationWarning
    ignore:builtin type swigvarlink.*:DeprecationWarning
    ignore:File contains an invalid specification.*:UserWarning
    ignore:Duplicate name:UserWarning
